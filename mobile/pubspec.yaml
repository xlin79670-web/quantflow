name: quantflow
description: QuantFlow - AI量化交易平台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.5.1
  
  # 网络
  dio: ^5.4.0
  
  # 路由
  go_router: ^14.2.0
  
  # UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3

  # WebView
  webview_flutter: ^4.10.0

  # Markdown
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
