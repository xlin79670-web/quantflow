name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5

      - name: Init Flutter Project
        working-directory: mobile
        run: |
          # 创建缺失的平台文件 (Android/iOS/macOS/Linux/Windows/Web)
          flutter create --org com.quantflow --project-name quantflow --platforms android . 2>&1 || true
          flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quantflow-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
