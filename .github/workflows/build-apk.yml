name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5

      - name: Init & Build
        run: |
          # 复制 Dart 源码
          cp -r mobile/lib /tmp/quantflow_lib
          cp mobile/pubspec.yaml /tmp/pubspec.yaml
          
          # 创建完整 Flutter 项目
          cd /tmp
          flutter create --org com.quantflow --project-name quantflow --platforms android quantflow_proj
          
          # 覆盖为我们的代码
          cd quantflow_proj
          rm -rf lib
          cp -r /tmp/quantflow_lib lib
          cp /tmp/pubspec.yaml pubspec.yaml
          
          # 获取依赖
          flutter pub get
          
          # 构建
          flutter build apk --release --no-tree-shake-icons
          
          # 复制 APK
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/quantflow.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quantflow-apk
          path: quantflow.apk
          retention-days: 90
