name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5

      - name: Build
        run: |
          # 创建新项目
          flutter create --org com.quantflow --project-name quantflow quantflow_app
          
          # 复制我们的 Dart 代码
          cp -r mobile/lib quantflow_app/
          
          # 复制 pubspec.yaml (合并依赖)
          cp mobile/pubspec.yaml quantflow_app/
          
          # 进入项目目录
          cd quantflow_app
          
          # 获取依赖
          flutter pub get
          
          # 构建 APK
          flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quantflow-apk
          path: quantflow_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
